name: Supabase Keep-Alive

on:
  schedule:
    - cron: '23 7,19 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Consultar Supabase
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_API_KEY: ${{ secrets.SUPABASE_API_KEY }}
        run: |
          set -euo pipefail
          : "${SUPABASE_URL:?Falta SUPABASE_URL}"
          : "${SUPABASE_API_KEY:?Falta SUPABASE_API_KEY}"

          curl --fail --silent --show-error \
            --connect-timeout 10 \
            --max-time 30 \
            --retry 3 \
            --retry-delay 5 \
            --retry-all-errors \
            --request POST \
            --header "apikey: ${SUPABASE_API_KEY}" \
            --header "Content-Type: application/json" \
            --data '{}' \
            "${SUPABASE_URL%/}/rest/v1/rpc/keep_alive"

          printf '\nConsulta completada correctamente.\n'
